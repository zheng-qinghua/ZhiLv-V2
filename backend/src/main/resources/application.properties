spring.application.name=zhilv

# ========== 密钥一律不写默认值:全部靠环境变量注入 ==========
# 本文件会进公开仓库,所以任何"开发默认值"都等于把密钥公开(改前 JWT 密钥和内部服务
# 密钥都是写死在这里的)。下面这几项默认值留空,启动时若没给会给出可读的报错。
#
# 本地跑之前先设好(Windows 用 setx,或写在 IDE 的运行配置里):
#   JWT_SECRET       JWT 签名密钥,>=32 字符(短了 jjwt 会拒绝)
#   AI_SERVICE_KEY   与 ai-service/.env 里的同名变量完全一致
#   DB_PASSWORD      本地 MySQL 的密码
# 示例(值换成你自己的):
#   setx JWT_SECRET "your-32-chars-or-longer-secret"
#   setx AI_SERVICE_KEY "your-shared-internal-key"
#   setx DB_PASSWORD "your-mysql-password"

# MySQL 连接(主机/库名/账号有本地默认值,密码必须由环境变量给)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/zhilv?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA:update 表示启动时自动建表/更新表结构,不需要手写建表 SQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT(密钥 >=32 字符;过期时间默认 24 小时,单位毫秒,可被环境变量覆盖)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Redis(本机默认 6379 无密码;可被环境变量覆盖)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# AI 服务(Python ai-service,独立进程,默认 8100;可被环境变量覆盖)
app.ai.base-url=${AI_BASE_URL:http://localhost:8100}

# 高德开放平台 Web服务 key(天气/地理编码)。本地通过 AMAP_API_KEY 环境变量注入,不写死进代码。
app.amap.key=${AMAP_API_KEY:}
app.amap.base-url=${AMAP_BASE_URL:https://restapi.amap.com/v3}

# ai-service 调内部接口(/internal/**)用的共享密钥,Python 侧用同名 AI_SERVICE_KEY。
app.ai.service-key=${AI_SERVICE_KEY:}
