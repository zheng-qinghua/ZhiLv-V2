spring.application.name=zhilv

# MySQL 连接(账号密码可用环境变量覆盖,默认 root/root 对应本地 docker 容器)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/zhilv?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA:update 表示启动时自动建表/更新表结构,不需要手写建表 SQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT(密钥 >=32 字符;过期时间默认 24 小时,单位毫秒,可被环境变量覆盖)
app.jwt.secret=${JWT_SECRET:zhilv-yuntu-jwt-secret-key-0123456789abcdef0123456789abcdef}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Redis(本机默认 6379 无密码;可被环境变量覆盖)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# AI 服务(Python ai-service,独立进程,默认 8100;可被环境变量覆盖)
app.ai.base-url=${AI_BASE_URL:http://localhost:8100}

# 高德开放平台 Web服务 key(天气/地理编码)。本地通过 AMAP_API_KEY 环境变量注入,不写死进代码。
app.amap.key=${AMAP_API_KEY:}
app.amap.base-url=${AMAP_BASE_URL:https://restapi.amap.com/v3}
